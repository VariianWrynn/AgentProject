const ID=()=> 'p'+Math.random().toString(36).slice(2,10); const clone=x=>JSON.parse(JSON.stringify(x)); const stamp=()=>new Date().toLocaleTimeString('zh-CN',{hour12:false});
function makeProject(title,category,desc){
  return {id:ID(),title,category,desc,created:new Date().toLocaleDateString('zh-CN'),stage:0,focus:0,
    done:[],sources:[],logs:{},chat:[],notes:[],iteration:0,phase:'ready',progress:0,report:null,reviewScore:null,history:[]};

let storage;try{storage=JSON.parse(localStorage.getItem('relay_v4_complete'))}catch{}

const projects = Array.isArray(storage?.projects) ? storage.projects.filter(project =>

function visibleProjects(){return state.projects.filter(project=>Boolean(project.relayDemoExample)===(state.mode==='demo'))}
function proj(){return visibleProjects().find(p=>p.id===state.projectId)||visibleProjects()[0]}
function changeResearchMode(mode){
  if(mode===state.mode)return;
  stopRun();
  if(mode==='demo'){
    realProjectId=state.projectId;
    let demo=state.projects.find(project=>project.relayDemoExample);
    if(!demo){
      demo=makeProject('示例 · 中国可再生能源概览','离线演示','用一份公开资料入口演示基本研究流程。');
      demo.relayDemoExample=true;
      demo.sources=[clone(BASE_SOURCES[0])];
      state.projects.push(demo);
    }
    state.projectId=demo.id;
  }else{
    state.projectId=realProjectId;
  }
  Object.assign(state,{mode,view:'workspace',queue:[],queueIndex:0,currentSource:null});
}
function save(){
  if(state.mode==='real')realProjectId=state.projectId;
  try{localStorage.setItem('relay_v4_complete',JSON.stringify({projects:state.projects.filter(p=>!p.relayDemoExample),projectId:realProjectId,theme:state.theme,zoom:state.zoom,mode:'real',apiUrl:state.apiUrl,speed:state.speed,glassStrength:state.glassStrength}))}catch{}
}
