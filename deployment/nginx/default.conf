limit_req_zone $binary_remote_addr zone=query:1m rate=6r/m;
server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;
    client_body_timeout 15s;
    location = /gateway-health { access_log off; return 200 'ok'; }
    location / { try_files $uri $uri/ /index.html; }
    location ~ ^/api/(knowledge(?:/|$)|sessions/[^/]+/memory(?:/|$)|demo(?:/|$)) { return 403; }
    location ~ ^/api/(query|chat|research/report)$ {
        limit_req zone=query burst=2 nodelay;
        limit_req_status 429;
        include /etc/nginx/conf.d/proxy.inc;
    }
    location /api/ { include /etc/nginx/conf.d/proxy.inc; }
}
