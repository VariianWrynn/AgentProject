limit_req_zone $binary_remote_addr zone=query:1m rate=6r/m;
limit_req_zone $binary_remote_addr zone=research:1m rate=6r/m;
map $request_method $attachment_upload_client {
    POST $binary_remote_addr;
    default '';
}
limit_req_zone $attachment_upload_client zone=attachments:1m rate=12r/m;
server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;
    client_body_timeout 15s;
    location = /gateway-health { access_log off; return 200 'ok'; }
    location ~ ^/relay([.]html|-layout[.]css|-live[.]js)$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ /index.html; }
    location ~ ^/api/(knowledge(?:/|$)|sessions/[^/]+/memory(?:/|$)|demo(?:/|$)) { return 403; }
    location = /api/research/report {
        limit_req zone=research burst=2 nodelay;
        limit_req_status 429;
        error_page 429 = @research_rate_limit;
        include /etc/nginx/conf.d/proxy.inc;
    }
    location @research_rate_limit {
        default_type application/json;
        add_header Retry-After 10 always;
        return 429 '{"detail":"Research start rate limit reached; retry shortly"}';
    }
    location ~ ^/api/(query|chat)$ {
        limit_req zone=query burst=2 nodelay;
        limit_req_status 429;
        include /etc/nginx/conf.d/proxy.inc;
    }
    location = /api/research/attachments {
        access_log off;
        limit_req zone=attachments burst=6 nodelay;
        limit_req_status 429;
        proxy_request_buffering off;
        include /etc/nginx/conf.d/proxy.inc;
    }
    location /api/ { include /etc/nginx/conf.d/proxy.inc; }
}
